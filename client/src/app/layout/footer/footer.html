<footer class="app-footer" role="contentinfo">
  <div class="app-footer__inner">
    <div class="app-footer__section">
      <h2 class="app-footer__heading">Categories</h2>
      <ul class="app-footer__category-list">
        @for (segment of categories; track segment) {
          <li>
            <a
              class="app-footer__link"
              [routerLink]="categoryRoute(segment)"
            >{{ categoryMeta[segment].breadcrumbLabel }}</a>
          </li>
        }
      </ul>
    </div>

    <div class="app-footer__section">
      <h2 class="app-footer__heading">Site</h2>
      <ul class="app-footer__page-list">
        <li><a class="app-footer__link" [routerLink]="['/', locale, 'about']">About</a></li>
        <li><a class="app-footer__link" [routerLink]="['/', locale, 'contact']">Contact</a></li>
        <li><a class="app-footer__link" [routerLink]="['/', locale, 'opportunities']">Opportunities</a></li>
      </ul>
    </div>
  </div>

  <div class="app-footer__copyright">
    &copy; {{ year }} Maaruri Tools
  </div>
</footer>
