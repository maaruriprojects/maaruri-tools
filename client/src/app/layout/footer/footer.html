<footer class="app-footer">
  <div class="app-footer__inner">
    <div class="app-footer__columns">
      <nav class="app-footer__column" aria-label="Tool categories">
        <h2 class="app-footer__heading">Categories</h2>
        <ul class="app-footer__list">
          @for (link of categoryLinks; track link.segment) {
            <li>
              <a [routerLink]="link.path">{{ link.label }}</a>
            </li>
          }
        </ul>
      </nav>

      <nav class="app-footer__column" aria-label="Site">
        <h2 class="app-footer__heading">Site</h2>
        <ul class="app-footer__list">
          @for (link of siteLinks; track link.label) {
            <li>
              <a [routerLink]="link.path">{{ link.label }}</a>
            </li>
          }
        </ul>
      </nav>
    </div>

    <div class="app-footer__legal">
      <span class="app-footer__copyright">© {{ currentYear }} {{ siteName }}</span>
      @for (link of legalLinks; track link.label) {
        <a class="app-footer__legal-link" [routerLink]="link.path">{{ link.label }}</a>
      }
    </div>
  </div>
</footer>
